<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Format JSON object</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script> 
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
        <header class="px-8 py-6 border-b border-slate-200 flex items-center justify-between bg-slate-50 gap-10">
            <h1 class="text-3xl font-bold text-slate-900 text-center">
                Function debugging
            </h1>
            <p class="text-slate-500 mt-1">This example debug a function so the total is calculated correctly.</p>
        </header>
        <section class="p-8">
            <div id="count" class="text-slate-500 mt-1"></div>
            <div id="result" class="text-slate-500 mt-1"></div>
        </section>
    </main> 

    <script>

        // Function to calculate the total price of items
        function calculateTotal(prices) {
            let total = 0;
            for (let i = 0; i < prices.length; i++) {
                total += prices[i];
            }
            return total;
        }
        const prices = [10, 20, 30, 40, 50];
        const total = calculateTotal(prices);
        console.log(total);

        document.getElementById('count').textContent = `Number of items: ${prices.length}`;
        document.getElementById('result').textContent = `Total price: ${total}`;
    </script>
</body>
</html>
