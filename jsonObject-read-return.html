<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Format JSON object</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script> 
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
        <header class="px-8 py-6 border-b border-slate-200 flex items-center justify-between bg-slate-50 gap-10">
            <h1 class="text-3xl font-bold text-slate-900 text-center">
                JSON Object Formatter
            </h1>
            <p class="text-slate-500 mt-1">This example demonstrates how to dynamically read a JSON object and format its properties into a readable string.</p>
        </header>
        <section class="p-8">
            <!-- Dynamic cards inserted here -->
            <div id="fields" class="grid gap-4 sm:grid-cols-2"></div>

            <!-- Final formatted output -->
            <div class="mt-8 rounded-2xl bbg-slate-900 p-6">
                <p class="text-slate-400 text-sm uppercase tracking-wider mb-2">
                    Formatted Output
                </p>
                <p id="output" class="text-lg leading-relaxed break-words"></p>
            </div>
        </section>
    </main> 

    <script>

        // Source object data
        const data = {
            name: "John Doe",
            age: 30,
            occupation: "Developer"
        };

        // Capitalize the first letter of a string
        const formatLabel = (value) =>
            value.charAt(0).toUpperCase() + value.slice(1);

        // Convert the object into a formatted string
        const formatObject = (obj) => 
            Object.entries(obj)
                .map(([key, value]) => `${formatLabel(key)}: ${value}`) // Array destructuring to format each key-value pair
                .join(', ');

        // Generate dynamic cards for each property in the object using array destructuring in the function parameters
        const createFieldCard = ([key, value]) => ` 
            <article class="rounded-2xl border border-slate-200 bg-slate-50 p-5">
                <!-- Card label -->
                <p class="text-sm text-slate-500 mb-1">
                    ${formatLabel(key)}
                </p>
                <!-- Card value -->
                <p class="text-xl font-semibold text-slate-800">
                    ${value}
                </p>
            </article>
        `;
        
        // Get the container for the cards
        const fieldsContainer = document.getElementById('fields');

        // Create and insert cards for each property in the data object
        fieldsContainer.innerHTML = Object.entries(data) // Convert the object into an array of [key, value] pairs
            .map(createFieldCard) // Map each pair to a card element using the createFieldCard function
            .join(''); // Concatenate the array of card elements into a single string for insertion
        
        // Get the output element and set its content to the formatted string
        const outputElement = document.getElementById('output');
        outputElement.textContent = formatObject(data);
        // The output will be: "Name: John Doe, Age: 30, Occupation: Developer"
        console.log(formatObject(data));
    </script>
</body>
</html>
